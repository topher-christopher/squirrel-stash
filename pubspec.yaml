name: squirrel_stash
description: "Cozy passive-simulation finance tracker & ambient focus companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  # 2D living diorama engine
  flame: ^1.38.2
  # State management
  flutter_riverpod: ^3.5.0
  # Offline-first local persistence (sqflite native on Android/iOS/macOS,
  # sqflite_common_ffi on Windows/Linux and in host tests)
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  path: ^1.9.1
  path_provider: ^2.1.6
  # Ambient loops & chimes
  audioplayers: ^6.8.1
  # Currency & date formatting
  intl: ^0.20.3
  http: ^1.6.0
  share_plus: ^13.3.1
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# package:sqlite3 (pulled in by sqflite_common_ffi) bundles SQLite via build
# hooks. Mobile + macOS use sqflite's native driver, so point the hook at the
# OS copy there (no download, nothing extra in the APK). Windows/Linux fetch
# the checksum-verified prebuilt binary.
hooks:
  user_defines:
    sqlite3:
      source:
        android: system
        ios: system
        macos: system
        default: sqlite3

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/rooms/
    - assets/images/icons/
    - assets/images/props/
    - assets/sprites/squirrels/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
